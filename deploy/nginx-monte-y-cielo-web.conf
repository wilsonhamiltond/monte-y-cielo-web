# Amazon Linux / RHEL : /etc/nginx/conf.d/monte-y-cielo-web.conf
# Debian / Ubuntu     : /etc/nginx/sites-available/monte-y-cielo-web, symlinked into sites-enabled
#
# nginx terminates TLS and reverse-proxies to the Next.js process (systemd unit
# monte-y-cielo-web.service) on 127.0.0.1:3001.
#
# The 443 blocks reference certs that must already exist, so obtain them BEFORE installing
# this file (see deploy/README.md):
#   sudo certbot certonly --nginx -d www.monteycieloaparments.com -d monteycieloaparments.com

# HTTP -> HTTPS for both apex and www. certbot inserts its challenge location here during
# issuance/renewal, so the blanket redirect does not block certificate renewal.
server {
    listen 80;
    server_name monteycieloaparments.com www.monteycieloaparments.com;
    return 301 https://www.monteycieloaparments.com$request_uri;
}

# Apex -> www, over TLS (cert covers both names).
server {
    listen 443 ssl;
    http2 on;
    server_name monteycieloaparments.com;

    ssl_certificate     /etc/letsencrypt/live/www.monteycieloaparments.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.monteycieloaparments.com/privkey.pem;

    return 301 https://www.monteycieloaparments.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.monteycieloaparments.com;

    ssl_certificate     /etc/letsencrypt/live/www.monteycieloaparments.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.monteycieloaparments.com/privkey.pem;

    # Self-contained modern TLS, so this file does not depend on certbot's include snippets.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # The admin uploads one photo per request, up to 15 MB (MAX_UPLOAD_BYTES in src/lib/photos.ts).
    # nginx's 1 MB default would reject them with 413 before they reach Next.js.
    client_max_body_size 16m;

    # Reverse proxy to the Next.js server. It also serves /_next/static (hashed, immutable)
    # and /uploads (photos from STORAGE_DIR), so everything goes through it.
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
